name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional tag to validate against the package version
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-and-dry-run:
    name: validate and publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install release validation tools
        run: cargo install --locked cargo-semver-checks cargo-deny
      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          package_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF_NAME}" = "v${package_version}"
          elif [ -n "${RELEASE_TAG}" ]; then
            test "${RELEASE_TAG}" = "v${package_version}"
          fi
      - name: Check semver compatibility
        run: cargo semver-checks check-release --all-features
      - name: Check dependency advisories
        run: cargo deny check advisories
      - name: Package crate
        run: cargo package --all-features
      - name: Validate publish
        run: cargo publish --dry-run --all-features

  publish:
    name: publish crate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: validate-and-dry-run
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish emailaddr
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  github-release:
    name: create GitHub release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists"
            exit 0
          fi

          release_args=(--verify-tag --generate-notes --title "${tag}")
          if [[ "${tag#v}" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${tag}" "${release_args[@]}"
