name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional tag to validate against the package version
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-and-dry-run:
    name: validate and publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install release validation tools
        run: cargo install --locked cargo-semver-checks cargo-deny
      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          package_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF_NAME}" = "v${package_version}"
          elif [ -n "${RELEASE_TAG}" ]; then
            test "${RELEASE_TAG}" = "v${package_version}"
          fi
      - name: Check semver compatibility
        run: cargo semver-checks check-release --all-features
      - name: Check dependency advisories
        run: cargo deny check advisories
      - name: Package crate
        run: cargo package --all-features
      - name: Validate publish
        run: cargo publish --dry-run --all-features

  publish:
    name: publish crate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: validate-and-dry-run
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Check crates.io publication state
        id: publication_state
        shell: bash
        run: |
          set -euo pipefail

          package_name="emailaddr"
          package_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          encoded_version="$(jq -rn --arg version "${package_version}" '$version | @uri')"
          response_file="$(mktemp "${RUNNER_TEMP}/crates-io-emailaddr.XXXXXX.json")"
          trap 'rm -f "${response_file}"' EXIT

          if ! http_status="$(
            curl --silent --show-error --location \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --user-agent "emailaddr-release-workflow/${GITHUB_RUN_ID}" \
              "https://crates.io/api/v1/crates/${package_name}/${encoded_version}"
          )"; then
            echo "::error::Failed to query crates.io publication state" >&2
            exit 1
          fi

          case "${http_status}" in
            404)
              echo "already_published=false" >>"${GITHUB_OUTPUT}"
              ;;
            200)
              if ! jq -e \
                --arg version "${package_version}" \
                --arg repository "${GITHUB_REPOSITORY}" \
                --arg sha "${GITHUB_SHA}" \
                '
                  .version.num == $version
                  and .version.trustpub_data.provider == "github"
                  and .version.trustpub_data.repository == $repository
                  and .version.trustpub_data.sha == $sha
                  and .version.yanked == false
                ' \
                "${response_file}" >/dev/null; then
                echo "::error::Published crate metadata does not match this repository and commit" >&2
                exit 1
              fi

              echo "already_published=true" >>"${GITHUB_OUTPUT}"
              echo "${package_name} ${package_version} is already published by this repository at this commit"
              ;;
            *)
              echo "::error::Unexpected crates.io HTTP status ${http_status}" >&2
              exit 1
              ;;
          esac
      - name: Authenticate with crates.io
        id: crates-io-auth
        if: ${{ steps.publication_state.outputs.already_published == 'false' }}
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish emailaddr
        if: ${{ steps.publication_state.outputs.already_published == 'false' }}
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  github-release:
    name: create GitHub release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify or create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          version_without_build="${version%%+*}"
          expected_prerelease=false
          if [[ "${version_without_build}" == *-* ]]; then
            expected_prerelease=true
          fi

          encoded_tag="$(jq -rn --arg tag "${tag}" '$tag | @uri')"
          response_file="$(mktemp "${RUNNER_TEMP}/github-release.XXXXXX.json")"
          trap 'rm -f "${response_file}"' EXIT

          if ! http_status="$(
            curl --silent --show-error \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --user-agent "emailaddr-release-workflow/${GITHUB_RUN_ID}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}"
          )"; then
            echo "::error::Failed to query GitHub release state" >&2
            exit 1
          fi

          case "${http_status}" in
            404)
              release_args=(--verify-tag --generate-notes --title "${tag}")
              if [[ "${expected_prerelease}" == "true" ]]; then
                release_args+=(--prerelease)
              fi

              gh release create "${tag}" "${release_args[@]}"
              ;;
            200)
              if ! jq -e \
                --arg tag "${tag}" \
                --argjson expected_prerelease "${expected_prerelease}" \
                '
                  .tag_name == $tag
                  and .name == $tag
                  and .draft == false
                  and .prerelease == $expected_prerelease
                ' \
                "${response_file}" >/dev/null; then
                echo "::error::Existing GitHub release metadata does not match the release contract" >&2
                exit 1
              fi

              echo "GitHub release ${tag} already exists with the expected state"
              ;;
            *)
              echo "::error::Unexpected GitHub API HTTP status ${http_status}" >&2
              exit 1
              ;;
          esac
